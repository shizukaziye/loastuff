# wrangler.bible.toml — Cloudflare Worker for the Grader tab's "pull from
# lostark.bible" feature. Separate from wrangler.toml (the Workers-AI vision
# Worker) so the two deploy independently and neither breaks the other.
#
# Fetches a lostark.bible character page server-side (with a browser User-Agent
# and a Bearer token — see SECRETS), extracts the embedded arkGridCores data, and
# returns each equipped astrogem as JSON. It is NOT a plain HTML fetcher: it
# carries two KV namespaces, a cron, five rate-limit bindings, and four secrets
# (below). No external paid API.
#
# Deploy:   cd worker && wrangler deploy --config wrangler.bible.toml
# Local:    cd worker && wrangler dev --config wrangler.bible.toml
#
# After deploy, copy the printed https URL into grader.js (WORKER_URL).

name = "astrogem-bible"
main = "astrogem-bible.js"
compatibility_date = "2026-06-01"

# SECRETS (never set here — this file is public; set each with
#     wrangler secret put <NAME> --config wrangler.bible.toml ):
#   BIBLE_TOKEN — the Bearer token lostark.bible's owners issued for this Worker. Every
#     character-page request must send `Authorization: Bearer <token>` or they return 401.
#     Without it the Worker still runs, but tokenless fetches (old queue items, an unarmed
#     probe) 401 and the fail-streak breaker drops the drain into probe mode.
#   BIBLE_CLIENT_ID / BIBLE_CLIENT_SECRET — the lostark.bible OAuth app credentials behind
#     the /oauth/* sign-in endpoints (PKCE code exchange + token revoke).
#   ADMIN_TOKEN — the admin credential. Admin surfaces (?metrics, ?control, ?dequeue,
#     ?feedback review, /oauth/probe-token) require it as an `X-Admin-Token` request header.
#     Fail-closed: while unset, NO request is admin. Send it only as a header, never in a URL.

# KV namespace: caches each pulled character (key = "region:name" lowercased); the cron
# builds the gzipped leaderboard snapshot (lb:snapshot:gz / :gz2) that ?list=1 serves; the
# lookup queue (q:f: / q:p:), drain state, and feedback (fb:) live here too. The Worker
# degrades gracefully if this binding is absent (fetches fresh, no caching). The owner
# creates the namespace (id below) and deploys; see worker/README-bible.md.
[[kv_namespaces]]
binding = "CHARS"
id = "0f51c3b5ac6d45a59186375d62879ad7"

# OAUTH: lostark.bible sign-in sessions (s:<sid>) + the drain's stored service/probe
# token (probe:token, used to fetch on the canary owner's behalf). MUST be declared here:
# a CLI `wrangler deploy` replaces the whole binding set, so a namespace bound only via the
# Cloudflare dashboard is silently dropped on the next deploy (that happened once — 2026-07).
[[kv_namespaces]]
binding = "OAUTH"
id = "288924b3208245e3920d1fb9cf3034cc"

# Cron fires EVERY MINUTE to drain the lookup queue (budget guard + circuit
# breaker inside). The leaderboard snapshot rebuild rides the same tick but is
# dirty-gated and throttled in code (~30 min cadence at most) — see
# README-bible.md and docs/how-the-queue-and-drain-work.md.
[triggers]
crons = ["* * * * *"]

# Edge rate-limit bindings (keyed by IP in code; NO KV touched on a blocked hit). period must
# be 10 or 60 seconds. HARD_CAP is the absolute backstop on EVERY request to stop scripted abuse.
[[ratelimits]]
name = "HARD_CAP"
namespace_id = "1000"
[ratelimits.simple]
limit = 60
period = 60

# Per-IP lookup throttle for EVERYONE: ~1 new-character lookup per 5s (2 per 10s; period must be 10 or 60).
# Cached lookups bypass this entirely — it only paces fresh lostark.bible fetches/enqueues. The password
# no longer changes this rate (it only adds queue priority + access while the site is degraded).
[[ratelimits]]
name = "LOOKUP_THROTTLE"
namespace_id = "1002"
[ratelimits.simple]
limit = 2
period = 10

# Leaderboard pulls (open to everyone): 3 per minute, to block spam-refresh.
[[ratelimits]]
name = "LB_THROTTLE"
namespace_id = "1003"
[ratelimits.simple]
limit = 3
period = 60

# GLOBAL overload gate: ONE shared counter across all requests (fixed key in code, not per-IP).
# When tripped (limit below) the worker degrades: NEW lookups and enqueues pause for EVERYONE
# equally — there is no password bypass. Cached reads keep working. period max is 60s, so this
# is a rolling per-minute proxy for "10k/hour" that auto-recovers.
[[ratelimits]]
name = "GLOBAL_GATE"
namespace_id = "1004"
[ratelimits.simple]
limit = 1000
period = 60

# Global enqueue cap: ~10 NEW characters queued per minute site-wide, matching the drain rate so the
# queue (and thus monthly writes) can never grow faster than we empty it. period must be 10 or 60.
[[ratelimits]]
name = "ENQUEUE_GATE"
namespace_id = "1005"
[ratelimits.simple]
limit = 10
period = 60

# Observability (logs) — optional, handy while validating the parser.
[observability]
enabled = true

# --- CORS ---
# The Worker hardcodes an exact-match Origin allowlist (ALLOW_ORIGINS in
# astrogem-bible.js): the site origins plus lostark.bible (the bookmarklet POSTs
# ?submit=1 from its character pages). To serve a new frontend origin, add it there.
