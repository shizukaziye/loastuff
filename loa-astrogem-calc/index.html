<!--
  App shell for the Lost Ark astrogem-cutting tool.

  Five tabs: "Grader" (#tab-grader, first/default), "Pipeline" (#tab-pipeline),
  "Advisor" (#tab-advisor), "Leaderboard" (#tab-leaderboard) and "Feedback"
  (#tab-feedback). The tab bar toggles .active on the panes and fires a
  'tabselected' event so a pane can act on activation. Each tab also has its
  own address (/loa-astrogem-calc/pipeline and so on): ROUTES in the inline
  script below.

  Scripts load in two sets:
    EAGER (bottom of <body>, in order): model/astrogem.js (the deterministic core
    on window.Astrogem — grade / gemRank / damagePercent / tierExpectedValue …),
    then gate.js, /shared/favorites.js, /shared/tip.js, /shared/class-icon.js,
    loadout-econ.js, bible-import.js, /shared/bible-oauth.js, gemlist.js (the Grader's "From screenshot" mode; its OCR
    files load from LAZY_GEMLIST on first use), grader.js (#tab-grader) and
    pipeline.js (#tab-pipeline, which also feeds the grader's plan section via
    pipelineReady).
    LAZY (the LAZY_TABS map in the inline script below): the Advisor stack
    (model/nested.js + model/dp.js + ocr/* + advisor*.js), leaderboard.js and
    feedback.js load on FIRST activation of their tab.

  Styling lives in styles.css (shared dark theme + tab styling); each tab module
  carries its own scoped <style> for module-specific bits.
-->

<!-- Pages this one links to are prerendered once a link to one is pointed at
     (Chromium; "moderate" is a short hover or a press), so crossing to the hub,
     the other tool or a character profile shows a finished page. Only the site's
     own app pages: never a file, a download or a new-tab link. Other browsers
     ignore this block and get a plain HTML prefetch instead (OTHER PAGES OF THE
     SITE, in the inline script below). -->
<script type="speculationrules">
{
  "prerender": [{
    "source": "document",
    "where": { "and": [
      { "href_matches": ["/", "/loa-bracelet-calc/*", "/loa-astrogem-calc/*", "/NA/*", "/EU/*", "/CE/*"] },
      { "not": { "href_matches": ["/*.js", "/*.css", "/*.json", "/*.png", "/*.svg", "/*.zip"] } },
      { "not": { "selector_matches": "[download], [target=_blank]" } }
    ]},
    "eagerness": "moderate"
  }]
}
</script>

<!-- BACK TO THE PROFILE. The same block, byte for byte, in the bracelet, astrogem
     and GPD tools (its rules are in <head>): change one, change all three.
     A visitor who came from a character profile (?c=REGION:Name) gets a way back
     to it while the tool holds that character. The tab keeps that character in
     sessionStorage loseii.profile.from, so a reload keeps the bar. This script
     runs before the first paint, so the bar never pushes the page down once drawn.
     The tool calls LoseiiBack.held() with each character it loads and
     LoseiiBack.clear() on a Reset: another character or a Reset ends the trail.
     LoseiiBack.link() is the small "Profile →" link a tool puts beside the name of
     the character it holds. -->
<div class="lp-back" id="lp-back" hidden><a id="lp-back-a" href="/">&larr; Back to the profile</a></div>
<script>
(function () {
  "use strict";
  var KEY = "loseii.profile.from";                // {"region":"NA","name":"Paroxysmal"}
  var bar = document.getElementById("lp-back");
  var link = document.getElementById("lp-back-a");
  var from = null;       // the profile this tab came from, while the bar stands
  var holds = null;      // the character the tool last said it holds
  var dropped = false;

  /** A profile's region and name, or null. CE is lostark.bible's EU; no other region has a profile. */
  function who(region, name) {
    var r = String(region == null ? "" : region).trim().toUpperCase();
    var n = String(name == null ? "" : name).trim();
    if (r === "CE") r = "EU";
    return (n && (r === "NA" || r === "EU")) ? { region: r, name: n } : null;
  }
  function same(x, y) {
    return !!(x && y && x.region === y.region && x.name.toLowerCase() === y.name.toLowerCase());
  }
  function path(c) { return "/" + c.region + "/" + encodeURIComponent(c.name); }
  // A prerendered page reads a copy of the tab's sessionStorage and loses what it
  // writes there, so every write waits until the page is shown.
  function whenShown(fn) {
    if (document.prerendering) document.addEventListener("prerenderingchange", fn, { once: true });
    else fn();
  }
  function stored() {
    var s = null;
    try { s = JSON.parse(sessionStorage.getItem(KEY) || "null"); } catch (e) {}
    return s ? who(s.region, s.name) : null;
  }
  function paint() {
    if (from) {
      var p = path(from), t = "← Back to " + from.name + "'s profile";
      if (link.getAttribute("href") !== p) link.setAttribute("href", p);
      if (link.textContent !== t) link.textContent = t;
    }
    if (bar.hidden !== !from) bar.hidden = !from;
  }
  function drop() {
    from = null;
    dropped = true;
    paint();
    whenShown(function () { try { sessionStorage.removeItem(KEY); } catch (e) {} });
  }
  function settle() {
    if (from && holds && !same(from, holds)) drop();
    else paint();
  }

  // ?c= is read the way the tools read it: no colon means NA.
  var q = null, came = null, i;
  try { q = new URLSearchParams(location.search).get("c"); } catch (e) {}
  if (q) {
    i = q.indexOf(":");
    came = who(i > 0 ? q.slice(0, i) : "NA", i >= 0 ? q.slice(i + 1) : q);
  }
  from = came || stored();
  paint();
  if (came) {
    whenShown(function () {
      if (!same(from, came)) return;              // another character landed first
      try { sessionStorage.setItem(KEY, JSON.stringify(came)); } catch (e) {}
    });
  } else if (document.prerendering) {
    // The tab's own sessionStorage arrives with the page: read it again then.
    document.addEventListener("prerenderingchange", function () {
      from = dropped ? null : stored();
      settle();
    }, { once: true });
  }

  window.LoseiiBack = {
    /** The tool now holds this character: anyone but the profile's own ends the trail. */
    held: function (region, name) {
      var n = String(name == null ? "" : name).trim();
      if (!n) return;
      // A region with no profile (KR) gets a key that matches no profile.
      holds = who(region, n) || { region: String(region || "?").toUpperCase(), name: n };
      settle();
    },
    /** A Reset ends the trail. */
    clear: drop,
    /** The small "Profile →" link for a character, or "" when its region has no
     *  profile. The empty title keeps an ancestor's native tooltip off it; the gloss
     *  is tip.js's. */
    link: function (region, name) {
      var c = who(region, name);
      return c ? '<a class="lp-prof" href="' + path(c) + '" title="" data-gloss="Opens this character\'s profile page.">Profile →</a>' : "";
    }
  };
})();
</script>

  <!-- Tab bar -->
  <div class="tabbar" id="tabbar" role="tablist" aria-label="Calculator sections">
    <button class="tab active" type="button" role="tab" id="tabbtn-grader" aria-selected="true" aria-controls="tab-grader" data-tab="grader" onclick="selectTab('grader')">Grader</button>
    <button class="tab" type="button" role="tab" id="tabbtn-pipeline" aria-selected="false" aria-controls="tab-pipeline" data-tab="pipeline" onclick="selectTab('pipeline')">Pipeline</button>
    <button class="tab" type="button" role="tab" id="tabbtn-advisor" aria-selected="false" aria-controls="tab-advisor" data-tab="advisor" onclick="selectTab('advisor')">Advisor</button>
    <button class="tab" type="button" role="tab" id="tabbtn-leaderboard" aria-selected="false" aria-controls="tab-leaderboard" data-tab="leaderboard" onclick="selectTab('leaderboard')">Leaderboard</button>
    <button class="tab" type="button" role="tab" id="tabbtn-feedback" aria-selected="false" aria-controls="tab-feedback" data-tab="feedback" onclick="selectTab('feedback')">Feedback</button>
  </div>

  <!-- Tab panes -->
  <section id="tab-grader" class="tabpane active" role="tabpanel" aria-labelledby="tabbtn-grader"></section>
  <section id="tab-pipeline" class="tabpane" role="tabpanel" aria-labelledby="tabbtn-pipeline"></section>
  <section id="tab-advisor" class="tabpane" role="tabpanel" aria-labelledby="tabbtn-advisor"></section>
  <section id="tab-leaderboard" class="tabpane" role="tabpanel" aria-labelledby="tabbtn-leaderboard"></section>
  <section id="tab-feedback" class="tabpane" role="tabpanel" aria-labelledby="tabbtn-feedback"></section>
</div>

<!-- Tab switching: toggle .active on the matching button + pane, and keep the
     tab in the address bar (ROUTES below). -->
<script>
"use strict";
// Heavy, rarely-used modules load on FIRST activation of their tab instead of on every visit:
// the Advisor stack (Tesseract CDN + OCR engines + the MC/DP models) and the Leaderboard.
// Each module self-initializes on parse (their DOMContentLoaded guards fall through after load),
// and the leaderboard's init self-fetches when its tab is already active.
// Deploy note: bump a file's ?v= here whenever you edit it — browsers cache-bust on it.
// (The eager list at the bottom of <body> is a DISJOINT set of files; nothing is shared.)
var LAZY_TABS = {
  advisor: [
    // NOTE: the Tesseract CDN bundle is NOT loaded on the main page anymore —
    // the background parse worker imports its own copy, and the inline fallback
    // lazy-injects it only if the offload is unavailable (structural-engine.js)
    "model/nested.js?v=54", "model/dp.js?v=59",
    "ocr/engine.js?v=55", "ocr/layout.js?v=55", "ocr/glyphs.js?v=55", "ocr/level-refs.js?v=4", "ocr/level-model.js?v=2", "ocr/name-model.js?v=2", "ocr/tile-model.js?v=1", "ocr/tesseract-engine.js?v=44",
    "ocr/structural-engine.js?v=104",
    "advisor-setup.js?v=50", "advisor-window.js?v=64",
    "advisor.js?v=96"
  ],
  leaderboard: ["leaderboard.js?v=60"],
  feedback: ["feedback.js?v=1"]
};
// The Grader's "From screenshot" mode reads the in-game astrogem list. Its
// engine + glyph templates are ~60 KB and only matter to that one mode, so
// gemlist.js injects them on first use. The pins live HERE and nowhere else —
// gemlist.js reads this array, so the two can never drift apart.
var LAZY_GEMLIST = ["ocr/gemlist-engine.js?v=1", "ocr/gemlist-refs.js?v=1"];
var lazyLoaded = {};
// Per-FILE, not per-tab: advisor-window.js is in the advisor's list AND injected
// on demand by the Grader's custom mode, and fetching it twice re-runs it.
var loadedScripts = {};
function loadScriptsSeq(list, done){
  if (!list.length) { done(); return; }
  if (loadedScripts[list[0]]) { loadScriptsSeq(list.slice(1), done); return; }
  var s = document.createElement('script');
  s.src = list[0];
  s.onload = function(){ loadedScripts[list[0]] = 1; loadScriptsSeq(list.slice(1), done); };
  s.onerror = function(){ loadScriptsSeq(list.slice(1), done); }; // skip a failed script (e.g. CDN blocked); modules degrade gracefully
  document.body.appendChild(s);
}
function ensureTabLoaded(name){
  if (!LAZY_TABS[name] || lazyLoaded[name]) return;
  lazyLoaded[name] = true;
  var pane = document.getElementById('tab-'+name);
  if (pane && !pane.childNodes.length) pane.innerHTML = '<div style="padding:24px;opacity:.65">Loading…</div>'; // replaced by the module's init
  loadScriptsSeq(LAZY_TABS[name], function(){
    // re-announce the activation for anything keyed on the event (the modules just initialized)
    try { document.dispatchEvent(new CustomEvent('tabselected', { detail: { tab: name } })); } catch (e) {}
  });
}

// ---- ROUTES ----------------------------------------------------------------
// Each tab has its own address, /loa-astrogem-calc/<slug>. The Grader keeps the
// bare tool path, so every link made before this still opens where it did.
// _redirects answers each slug path with this page (a 200 rewrite). A slug has no
// trailing slash, so the relative asset paths resolve exactly as they always have.
// The part before the slug is read off the address, never written in here, so
// www, a Pages preview and localhost all behave alike.
var TAB_SLUGS = {
  grader: 'grader', pipeline: 'pipeline', advisor: 'advisor',
  leaderboard: 'leaderboard', feedback: 'feedback'
};
var DEFAULT_TAB = 'grader';
var ROUTE_BASE = location.pathname.replace(/[^\/]*$/, '');   // "/loa-astrogem-calc/"
var currentTab = DEFAULT_TAB;

/** The tab an address names: its last segment, as a slug. Anything else is the Grader. */
function tabFromPath(path){
  var seg = String(path || '').replace(/^.*\//, '').toLowerCase();
  for (var t in TAB_SLUGS) {
    if (TAB_SLUGS.hasOwnProperty(t) && seg === TAB_SLUGS[t]) return t;
  }
  return DEFAULT_TAB;
}
/** Point the address at a tab, keeping the query and the hash. Never adds a duplicate entry. */
function writeRoute(name, replace){
  var href = ROUTE_BASE + (name === DEFAULT_TAB ? '' : TAB_SLUGS[name]) + location.search + location.hash;
  if (!replace && href === location.pathname + location.search + location.hash) return;
  try { history[replace ? 'replaceState' : 'pushState']({ tab: name }, '', href); } catch (e) {}
}
// Keyboard: Enter/Space work on any non-native role="button" control, and the arrow
// keys (plus Home/End) move between the tabs, as the ARIA tab pattern expects.
document.addEventListener('keydown', function (e) {
  var t = e.target;
  if (!t || !t.getAttribute) return;
  if (t.getAttribute('role') === 'button' && t.tagName !== 'BUTTON' && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault(); t.click(); return;
  }
  if (t.getAttribute('role') === 'tab') {
    var tabs = Array.prototype.slice.call(document.querySelectorAll('#tabbar [role="tab"]'));
    var i = tabs.indexOf(t), n = tabs.length, j = -1;
    if (e.key === 'ArrowRight') j = (i + 1) % n;
    else if (e.key === 'ArrowLeft') j = (i - 1 + n) % n;
    else if (e.key === 'Home') j = 0;
    else if (e.key === 'End') j = n - 1;
    if (j < 0 || i < 0) return;
    e.preventDefault(); tabs[j].focus(); tabs[j].click();
  }
});
function paintTab(name){
  var tabs = document.querySelectorAll('.tab');
  for (var i=0;i<tabs.length;i++){
    var on = tabs[i].dataset.tab===name;
    tabs[i].classList.toggle('active', on);
    tabs[i].setAttribute('aria-selected', on ? 'true' : 'false');
  }
  var panes = document.querySelectorAll('.tabpane');
  for (var j=0;j<panes.length;j++){
    panes[j].classList.toggle('active', panes[j].id === ('tab-'+name));
  }
}
/** Show a tab: the class toggles, its scripts on first use, the event. Leaves the address alone. */
function showTab(name){
  currentTab = name;
  paintTab(name);
  ensureTabLoaded(name);
  // Notify tab modules that lazy-load on activation (e.g. the Leaderboard fetch).
  try { document.dispatchEvent(new CustomEvent('tabselected', { detail: { tab: name } })); } catch (e) {}
}
/** A tab switch from anywhere (a tab button, a board row), and the address follows it. */
function selectTab(name){
  showTab(name);
  if (TAB_SLUGS.hasOwnProperty(name)) writeRoute(name, false);
}
// Back and Forward: show the tab the address names, and write nothing.
window.addEventListener('popstate', function(){
  var t = tabFromPath(location.pathname);
  if (t !== currentTab) showTab(t);
});
// Paint the addressed tab now, before the app scripts below have parsed, so a
// deep link never flashes the Grader first. Its scripts and its event wait for
// routeBoot(), when every module is listening.
(function(){
  var t = tabFromPath(location.pathname);
  if (t !== DEFAULT_TAB) { currentTab = t; paintTab(t); }
})();

// ---- HOVER PREFETCH --------------------------------------------------------
// Pointing at a tab, or tabbing to it, fetches its lazy scripts into the cache,
// once, so the first click is as quick as the second. The URLs are LAZY_TABS'
// own, so the <script> tags ensureTabLoaded adds later come straight from cache.
var prefetched = {};
function prefetchTab(name){
  if (!LAZY_TABS[name] || prefetched[name] || lazyLoaded[name]) return;
  prefetched[name] = true;
  var cn = navigator.connection;
  if (cn && cn.saveData) return;                   // the reader asked for less data
  for (var i = 0; i < LAZY_TABS[name].length; i++) {
    if (loadedScripts[LAZY_TABS[name][i]]) continue;   // already ran (the Grader's custom mode)
    var l = document.createElement('link');
    l.rel = 'prefetch';
    l.href = LAZY_TABS[name][i];
    document.head.appendChild(l);
  }
}
(function(){
  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].addEventListener('mouseenter', function(){ prefetchTab(this.dataset.tab); });
    tabs[i].addEventListener('focus', function(){ prefetchTab(this.dataset.tab); });
  }
})();

// ---- ?c=REGION:Name --------------------------------------------------------
// Opens one character in the Grader: a profile page's "Open in Astrogem
// Calculator", or any shared link. The tab stays whatever the path says. The
// profile page may leave a record in localStorage; a copy under ten minutes old
// that carries gems is shown at once, like a board row. Otherwise the name goes
// through the Grade loadout lookup. Either way `c` then leaves the address, so a
// reload does not look the character up again.
var PROFILE_STASH = 'loseii.profile.record:';   // + "<REGION>|<Name>" -> {record, savedAt}
var STASH_FRESH_MS = 10 * 60 * 1000;
function charParam(){
  var q = null;
  try { q = new URLSearchParams(location.search).get('c'); } catch (e) {}
  if (!q) return null;
  var i = q.indexOf(':');
  var region = (i > 0 ? q.slice(0, i) : 'NA').trim().toUpperCase();
  var name = (i >= 0 ? q.slice(i + 1) : q).trim();
  return name ? { region: region, name: name } : null;
}
function dropCharParam(){
  try {
    var qs = new URLSearchParams(location.search);
    qs.delete('c');
    var rest = qs.toString();
    history.replaceState(history.state, '', location.pathname + (rest ? '?' + rest : '') + location.hash);
  } catch (e) {}
}
/** The profile page's record for this character, if it is fresh. EU and CE are one region. */
function freshStash(region, name){
  var regs = [region], raw = null, i, k, id;
  if (region === 'EU') regs.push('CE'); else if (region === 'CE') regs.push('EU');
  try {
    for (i = 0; i < regs.length && !raw; i++) raw = localStorage.getItem(PROFILE_STASH + regs[i] + '|' + name);
    // The profile page may spell the name as its own address does, so match case-blind.
    for (i = 0; i < localStorage.length && !raw; i++) {
      k = localStorage.key(i);
      if (!k || k.indexOf(PROFILE_STASH) !== 0) continue;
      id = k.slice(PROFILE_STASH.length).split('|');
      if (id.length === 2 && regs.indexOf(id[0].toUpperCase()) !== -1 &&
          id[1].toLowerCase() === name.toLowerCase()) raw = localStorage.getItem(k);
    }
  } catch (e) { return null; }
  var s = null;
  try { s = JSON.parse(raw); } catch (e) {}
  if (!s || !s.record) return null;
  var age = Date.now() - (typeof s.savedAt === 'number' ? s.savedAt : Date.parse(s.savedAt));
  return (age > -60000 && age < STASH_FRESH_MS) ? s.record : null;   // an unreadable savedAt is NaN and fails
}
/** The gem loadout inside a stashed record: the astrogem Worker's answer itself, or a record carrying one as `astrogem`. */
function stashedGems(rec){
  if (rec && Array.isArray(rec.gems) && rec.gems.length) return rec;
  if (rec && rec.astrogem && Array.isArray(rec.astrogem.gems) && rec.astrogem.gems.length) return rec.astrogem;
  return null;
}
function bootCharacter(){
  var c = charParam();
  if (!c) return;
  // The Grader reads NA, EU (lostark.bible's CE) and KR. Any other region would
  // fall back to whatever the region box last held, so it opens nothing.
  if (!/^(NA|EU|CE|KR)$/.test(c.region)) { dropCharParam(); return; }
  var tries = 0;
  (function go(){
    // grader.js defines the hook in its init, on DOMContentLoaded.
    if (typeof window.graderOpenCharacter !== 'function') {
      if (++tries < 100) { setTimeout(go, 50); return; }
      dropCharParam();
      return;
    }
    // A PRERENDER IS NOT A VISIT (see PRERENDER below). A stored loadout only
    // draws, so it may show while the page is still hidden. A lookup can queue a
    // pull on the Worker, so it waits until the page is shown.
    var rec = stashedGems(freshStash(c.region, c.name));
    if (rec) window.graderOpenCharacter(c.region, c.name, rec);
    whenShown(function(){
      if (!rec) window.graderOpenCharacter(c.region, c.name, null);
      dropCharParam();
    });
  })();
}

// ---- PRERENDER -------------------------------------------------------------
// Chromium may build this page in the background when a link to it is pointed at
// (the speculation rules in <head>, on this site's other pages) and throw it away
// unseen. Drawing is welcome then; anything that writes the reader's saved state,
// queues work on a Worker or leaves the page waits for the page to be shown.
// bible-oauth.js and grader.js's automatic re-pull hold their own side of this.
function whenShown(fn){
  if (document.prerendering) document.addEventListener('prerenderingchange', fn, { once: true });
  else fn();
}

// ---- OTHER PAGES OF THE SITE ------------------------------------------------
// The speculation rules prerender the site's other app pages in Chromium. Other
// browsers ignore them, so there a hover or focus on such a link fetches the
// page's HTML into the cache instead, once per address. Same rule as <head>: the
// hub, both tools and the profiles, never a file, a download or a new-tab link.
var SPECULATES = !!(window.HTMLScriptElement && HTMLScriptElement.supports &&
  HTMLScriptElement.supports('speculationrules'));
var APP_PATH = /^\/(?:$|loa-bracelet-calc\/|loa-astrogem-calc\/|(?:NA|EU|CE)\/)/;
var FILE_PATH = /\.(?:js|css|json|png|svg|zip)$/i;
var pagePrefetched = {};
function prefetchPage(e){
  var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
  if (!a || a.hasAttribute('download') || a.target === '_blank') return;
  var u;
  try { u = new URL(a.href, location.href); } catch (err) { return; }
  if (u.origin !== location.origin || !APP_PATH.test(u.pathname) || FILE_PATH.test(u.pathname)) return;
  var key = u.pathname + u.search;
  if (key === location.pathname + location.search || pagePrefetched[key]) return;
  pagePrefetched[key] = true;
  var cn = navigator.connection;
  if (cn && cn.saveData) return;                   // the reader asked for less data
  var l = document.createElement('link');
  l.rel = 'prefetch';
  l.href = key;
  document.head.appendChild(l);
}
if (!SPECULATES) {
  document.addEventListener('mouseover', prefetchPage);
  document.addEventListener('focusin', prefetchPage);
}

/**
 * Called once, from the script at the end of <body>, after every module has
 * initialised: activate the addressed tab exactly as a click would, settle the
 * address in place, then open ?c=.
 */
function routeBoot(){
  var t = tabFromPath(location.pathname);
  if (t !== DEFAULT_TAB) showTab(t);
  writeRoute(t, true);
  bootCharacter();
}
</script>

<!-- EAGER: the model core + the default Grader tab and its dependencies (pipeline feeds the
     grader's plan section via pipelineReady). The Advisor stack and Leaderboard are in
     LAZY_TABS above and load on first tab activation. -->
<!-- ?v= cache-buster: bump on each deploy so browsers load fresh JS without a hard-refresh -->
<!-- `defer` on all of them: they download in parallel, run in this order once the
     page has parsed, and never block the first paint. An INLINE script cannot be
     deferred and runs before all of these, so no inline script may read a global
     these files define at parse time (the inline scripts above only define
     functions, called later). The inline script just below keeps their
     "init now or on DOMContentLoaded?" checks answering as they did. -->
<script>
// DEFER, SAFELY. Several app scripts open with "if document.readyState is
// 'loading', init on DOMContentLoaded, else init now". Loaded as plain tags the
// answer was 'loading', so every init waited until ALL the files had run, and
// then ran in file order. Deferred, the answer would be 'interactive' and each
// would init at once, before the files after it exist (the Grader before
// pipeline.js). So until DOMContentLoaded this page keeps answering 'loading',
// which is what those checks mean to ask: is DOMContentLoaded still to come?
// This listener is the first one added, so the real value is back before any
// module's own DOMContentLoaded handler runs.
(function () {
  try {
    Object.defineProperty(document, "readyState", { configurable: true, get: function () { return "loading"; } });
    document.addEventListener("DOMContentLoaded", function () { delete document.readyState; }, { once: true });
  } catch (e) {}
})();
</script>
